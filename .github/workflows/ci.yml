name: ci

# 품질 게이트 (ADR-0030, docs/CI.md). 로컬에서는 `python scripts/check.py` 가 같은 검사를 돌린다.
on:
  push:
    branches: [main, dev, "feature-*"]
  pull_request:
  workflow_dispatch:
  # 릴리스(bundle.yml)가 번들을 붙이기 전에 같은 커밋으로 이 검사를 부른다
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 포맷 · 정적 검사 · 타입 검사 · 테스트와 커버리지 하한
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 실제 영상 테스트(ffmpeg)를 조용히 건너뛰지 않는다. ffmpeg 는 video extra 가 가져온다
      FRAME_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,llm,video]"
      - name: 포맷
        run: python scripts/check.py format
      - name: 정적 검사
        run: python scripts/check.py lint
      - name: 타입 검사
        run: python scripts/check.py types
      - name: 테스트와 커버리지 하한
        run: python scripts/check.py tests --xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  compat:
    # 같은 테스트를 번들·런처가 쓰는 Python 3.12 와 Windows 에서도 돌린다 (Windows 전용 코드가 있다)
    name: compat (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.11" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      FRAME_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,llm,video]"
      - run: python -m pytest

  audit:
    # 의존성의 알려진 취약점. 처음에는 결과만 보고 머지를 막지 않는다 (ADR-0030)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[llm,video]" pip-audit
      - run: pip-audit --skip-editable --progress-spinner off

  docker:
    # 이미지를 빌드해 띄우고 /health 가 답하는지 본다 (이슈 #6). 로컬에서 돌려 보지 못한 잡이라
    # 처음에는 결과만 보고 머지를 막지 않는다 (ADR-0030, docs/CI.md 6절)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t frame-api:ci .
      - name: 이미지가 뜨고 건강 검사가 통과하는지
        run: |
          docker run -d --name frame-api -p 127.0.0.1:8000:8000 frame-api:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs frame-api
          exit 1

  frontend:
    # frontend/ 가 있는 브랜치에서만 빌드한다 (없는 브랜치에서는 단계가 건너뛰어진다)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: echo "present=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npm test
          npm run build

  demo-smoke:
    # 새 기기 시연 경로(docs/DEMO.md)를 세 OS 에서 그대로 따라 한다: setup → smoke (키·외부 호출 없음)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python scripts/frame_demo.py setup --no-key
      - run: python scripts/frame_demo.py smoke
