[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frame"
version = "0.1.0"
description = "FRAME - 구조화된 중간 표현 기반 숏폼 비디오 선택적 편집 및 일관성 제어 프레임워크 (backend & pipeline)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # FastAPI 는 0.133.0 부터 Starlette 의 판을 위로 묶지 않는다. 그래서 Starlette 도 여기서 정확히 고정한다 (ADR-0033).
  # 올릴 때는 둘을 함께 보고 docs/openapi.json 을 다시 만든다. 설치된 판이 이 고정과 다르면 테스트가 알려 준다
  "fastapi==0.133.0",
  "starlette==1.3.1",
  "uvicorn==0.34.2",
  "sqlalchemy>=2.0,<3",
  "pymysql>=1.1",
  # 참조 이미지 업로드(multipart/form-data, #12). 0.0.18 미만은 잘못된 경계로 서비스를 멈추게 하는 취약점이 있다
  "python-multipart>=0.0.18,<0.1",
]

[project.optional-dependencies]
# ruff·mypy 는 버전에 따라 검사 결과가 달라지므로 정확히 고정한다 (CI 게이트의 기준. ADR-0030)
# httpx2: Starlette 1.x 의 TestClient 가 쓴다 (없으면 httpx 로 물러나며 경고한다). httpx: openai 의 오류 객체를 만드는 테스트가 쓴다
dev = [
  "pytest>=8",
  "pytest-cov",
  "httpx>=0.27",
  "httpx2>=2.0",
  "ruff==0.17.4",
  "mypy==2.4.1",
  "jsonschema>=4",
]
llm = ["openai>=1.50"]
# FRAME_GENERATOR=external_api 의 클립 정규화용 ffmpeg (PATH 에 ffmpeg 가 있으면 필요 없음)
video = ["imageio-ffmpeg==0.6.0"]
# FRAME_SPEECH_RECOGNIZER=faster_whisper: 이 컴퓨터에서 말소리를 받아 적는다 (모델은 처음 쓸 때 받는다)
speech-local = ["faster-whisper>=1.1,<2"]
# 실제 모델 어댑터를 붙일 때만 설치 (문서의 개발 환경 버전 고정)
ml = ["torch==2.5.1", "torchvision==0.20.1", "opencv-python==4.10.0.84", "numpy==1.26.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# 실제 호출(slow)·GPU 테스트는 기본 실행에서 뺀다. 돌릴 때는 `-m slow` 를 준다 (명령줄의 -m 이 뒤에 와서 이긴다. ADR-0030)
addopts = "-ra --strict-markers --strict-config -m 'not slow and not gpu'"
xfail_strict = true
markers = [
  "ac(id): 연결된 Acceptance Criteria ID (예: AC-01)",
  "slow: 실제 모델·외부 API를 호출하는 느린 테스트 (기본 제외)",
  "gpu: GPU가 필요한 테스트 (기본 제외)",
]

[tool.coverage.run]
source = ["frame"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "I", "B", "UP",
  # 2026-11 감사에서 켠 것 (ADR-0030). 켤 때 위반이 없었거나 몇 건을 고쳤다
  "PIE", "RET", "DTZ", "A", "ERA", "PGH", "PERF", "LOG", "G", "ASYNC", "EXE", "ICN", "INP", "RSE", "SLOT",
  "BLE", "SIM", "C4", "PTH", "FURB", "ISC",
  # 기준선(아래 파일별 예외·줄 단위 noqa)과 함께 켠 것: 보안 · print · 복잡도
  "S", "T20", "C90",
  # 비교식의 이름 없는 수 (ADR-0032): 상태 코드 · 상한 · 임계값에는 이름을 붙인다. 0 · 1 과의 비교는 걸리지 않는다
  "PLR2004",
]
ignore = [
  # 모든 subprocess 호출에 걸려 신호가 없다. 위험한 형태(shell=True 는 S602, 셸 문자열은 S604·S605)는 그대로 잡는다
  "S603",
]

[tool.ruff.lint.mccabe]
max-complexity = 19  # 켤 때의 최댓값 (identity/vlm_crop.py 의 extract). 올리지 않고 내려간다

[tool.ruff.lint.per-file-ignores]
# 테스트는 assert 가 본업이고, 가짜 키와 난수는 보안 대상이 아니다. 기대하는 값을 수로 직접 견준다
"tests/**" = ["S101", "S105", "S106", "S311", "PLR2004"]
# 실제 호출 테스트는 결과를 사람이 읽게 찍는다
"tests/live/**" = ["T20"]
# 명령줄 도구는 표준 출력이 인터페이스다
"src/frame/tools/**" = ["T20"]
"scripts/**" = ["T20", "INP001"]
# 기준선 (감사 C-04): 실행 중 불변식을 assert 로 확인하는 기존 파일. 목록에 더하지 않고 줄여 간다
"src/frame/adapters/generator/records/_clip_cache.py" = ["S101"]
"src/frame/adapters/generator/records/_job_ledger.py" = ["S101"]
"src/frame/adapters/generator/resilience.py" = ["S101"]
"src/frame/adapters/generator/openrouter/generator.py" = ["S101"]
"src/frame/adapters/llm/openai_client.py" = ["S101"]
"src/frame/domain/comparison.py" = ["S101"]
"src/frame/domain/identity.py" = ["S101"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # 코드는 100 칸으로 포맷하되, 한글 docstring/주석은 120 칸까지 허용

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
strict = false
warn_unused_configs = true  # 아래 예외가 더는 맞는 모듈이 없으면 알려 준다

# 도메인은 strict 와 같은 수준으로 검사한다 (켤 때 0건). 다른 패키지는 strict 기준선(2026-11: 42건)을 줄인 뒤 여기에 더한다 (ADR-0030)
[[tool.mypy.overrides]]
module = ["frame.domain.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# 형 정보가 없는 외부 패키지
[[tool.mypy.overrides]]
module = ["imageio_ffmpeg"]
ignore_missing_imports = true

# 선택 설치(speech-local)라 검사 환경에 없는 외부 패키지. 쓰는 곳은 adapters/speech/faster_whisper.py 하나다
[[tool.mypy.overrides]]
module = ["faster_whisper"]
ignore_missing_imports = true
