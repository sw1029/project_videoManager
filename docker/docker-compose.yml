# 개발용 구성: MySQL + API. 실행 전에 비밀번호 둘을 정한다 (docker/.env.example 을 docker/.env 로 복사해 채운다).
#
#   docker compose -f docker/docker-compose.yml up --build
#
# DB 와 API 는 이 컴퓨터(127.0.0.1)에서만 접속된다. API 에는 인증이 없으므로, 밖에 열려면 앞에 인증을 두고 연다.
services:
  db:
    image: mysql:8.4.4
    environment:
      MYSQL_ROOT_PASSWORD: ${FRAME_DB_ROOT_PASSWORD:?FRAME_DB_ROOT_PASSWORD 를 정하세요 (docker/.env)}
      MYSQL_DATABASE: frame
      MYSQL_USER: frame
      MYSQL_PASSWORD: ${FRAME_DB_PASSWORD:?FRAME_DB_PASSWORD 를 정하세요 (docker/.env)}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # MySQL 은 초기화하는 동안 소켓으로만 임시 서버를 띄운다. TCP 로 물어야 진짜 서버가 뜬 뒤에 통과한다
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -uframe -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      # 비밀번호는 주소에 그대로 들어가므로 영문·숫자로 정한다 (@ : / 같은 글자는 주소를 깨뜨린다)
      FRAME_DB_URL: mysql+pymysql://frame:${FRAME_DB_PASSWORD:?FRAME_DB_PASSWORD 를 정하세요 (docker/.env)}@db:3306/frame
      FRAME_DB_CREATE_SCHEMA: "true"   # 개발용. 운영은 Alembic 마이그레이션으로 교체
      FRAME_STRUCTURER: rule_based
      FRAME_GENERATOR: fake            # 실제 모델: external_api (키는 OPENROUTER_API_KEY 로 넘긴다)
      FRAME_TRACKER: fake
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      db:
        condition: service_healthy

volumes:
  artifacts:
  db_data:
